# 合并到自己的 Codex 配置；用工程绝对路径替换 D:/courses/ecommerce-agent。
# 不要覆盖已有模型配置，不要把 APPROVER_TOKEN 加入 env_vars。
[mcp_servers.ecommerce_stdio]
command = "D:/courses/ecommerce-agent/.venv/Scripts/python.exe"
args = ["-m", "app.mcp_server"]
cwd = "D:/courses/ecommerce-agent"
env_vars = ["AGENT_TOKEN", "API_BASE_URL"]
startup_timeout_sec = 20
tool_timeout_sec = 30
