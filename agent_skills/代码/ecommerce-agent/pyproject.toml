[project]
name = "ecommerce-agent-course"
version = "0.1.0"
description = "电商订单异常排查与处理助手"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<2.1", "pymysql[rsa]>=1.1,<2",
  "mcp>=1.20,<2", "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "python-dotenv>=1,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
