services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_only
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: course
      MYSQL_PASSWORD: course_local_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - course_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  course_mysql:
